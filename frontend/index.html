<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F7F8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090A" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Orbit — a calm, customizable daily task and productivity tracker." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Orbit</title>
    <script>
      // Apply the last-known theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('orbit.theme') || 'dark'
        var a = localStorage.getItem('orbit.accent')
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        if (a) document.documentElement.style.setProperty('--accent', a)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
