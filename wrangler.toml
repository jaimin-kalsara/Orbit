# Cloudflare Workers config (Workers Builds runs `npx wrangler deploy` from the repo root).
name = "orbit"
main = "cloudflare/worker.js"
compatibility_date = "2026-11-01"

# Keep variables set in the dashboard (BACKEND_URL) instead of wiping them on every deploy.
keep_vars = true

# `wrangler deploy` builds the React app first, so no separate build command is needed.
[build]
command = "npm run build"

[assets]
directory = "frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# These paths go to the Worker, which proxies them to the Django backend (BACKEND_URL).
run_worker_first = ["/api/*", "/admin", "/admin/*", "/static/*"]
